<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SKV Press Orders</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      font-size: 22px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      padding: 10px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
    }

    .items-header,
    .item-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 50px;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .items-header {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .total {
      text-align: right;
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th,
    td {
      padding: 12px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #f9fafb;
      white-space: nowrap;
    }

    .multi-line div {
      padding: 4px 0;
      min-height: 28px;
      border-bottom: 1px solid #f1f1f1;
    }

    .multi-line div:last-child {
      border-bottom: none;
    }

    @media (max-width: 700px) {

      header {
        padding: 14px;
      }

      header h1 {
        font-size: 18px;
      }

      header button {
        padding: 9px 12px;
      }

      .container {
        padding: 12px;
      }

      .card {
        padding: 15px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .items-header {
        display: none;
      }

      .item-row {
        grid-template-columns: 1fr 1fr;
        background: #f9fafb;
        padding: 12px;
        border-radius: 8px;
      }

      .item-row input:first-child {
        grid-column: span 2;
      }

      .delete-btn {
        grid-column: span 2;
        width: 100%;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        min-width: 650px;
      }

      th,
      td {
        padding: 10px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>SKV Press Orders</h1>

  <button class="primary" onclick="showOrderForm()">
    + New Order
  </button>
</header>


<div class="container">

  <!-- NEW ORDER FORM -->

  <div id="orderForm" class="card">

    <div class="top-bar">
      <h2>New Order</h2>
    </div>


    <div class="form-grid">

      <div>
        <label>Party Name</label>

        <input
          type="text"
          id="partyName"
          placeholder="Enter party name"
        />
      </div>


      <div>
        <label>Order Date</label>

        <input
          type="date"
          id="orderDate"
        />
      </div>

    </div>


    <br>


    <h3>Order Items</h3>


    <div class="items-header">
      <div>Product Details</div>
      <div>Quantity</div>
      <div>Amount</div>
      <div></div>
    </div>


    <div id="itemsContainer"></div>


    <br>


    <button
      type="button"
      class="secondary"
      onclick="addItem()"
    >
      + Add Item
    </button>


    <div class="total">
      Total: ₹ <span id="totalAmount">0.00</span>
    </div>


    <div class="actions">

      <button
        type="button"
        class="secondary"
        onclick="clearForm()"
      >
        Cancel
      </button>


      <button
        type="button"
        class="primary"
        onclick="saveOrder()"
      >
        Save Order
      </button>

    </div>

  </div>


  <!-- ORDERS LIST -->

  <div class="card">

    <div class="top-bar">

      <h2>Orders</h2>

      <button
        class="secondary"
        onclick="loadOrders()"
      >
        Refresh
      </button>

    </div>


    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>Date</th>
            <th>Party Name</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Amount</th>
          </tr>
        </thead>


        <tbody id="ordersList"></tbody>

      </table>

    </div>

  </div>

</div>


<script>

  /* =========================================
     SUPABASE CONFIGURATION
     ========================================= */

  const SUPABASE_URL = "https://vcyhaztkucppqfcvoari.supabase.co";

  const SUPABASE_KEY = "sb_publishable_KuuyyC6f2LL6T2M1F0V8OQ_wSVRNccO";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     INITIAL SETUP
     ========================================= */

  document
    .getElementById("orderDate")
    .valueAsDate = new Date();


  addItem();

  loadOrders();


  /* =========================================
     ADD ITEM
     ========================================= */

  function addItem() {

    const container =
      document.getElementById("itemsContainer");


    const row =
      document.createElement("div");


    row.className = "item-row";


    row.innerHTML = `

      <input
        type="text"
        class="product"
        placeholder="Product details"
      />

      <input
        type="number"
        class="quantity"
        placeholder="Qty"
        min="1"
      />

      <input
        type="number"
        class="amount"
        placeholder="Amount"
        min="0"
        step="0.01"
        oninput="calculateTotal()"
      />

      <button
        type="button"
        class="delete-btn"
        onclick="removeItem(this)"
      >
        ✕
      </button>

    `;


    container.appendChild(row);

  }


  /* =========================================
     REMOVE ITEM
     ========================================= */

  function removeItem(button) {

    const row = button.parentElement;

    row.remove();

    calculateTotal();

  }


  /* =========================================
     CALCULATE TOTAL
     ========================================= */

  function calculateTotal() {

    let total = 0;


    const amounts =
      document.querySelectorAll(".amount");


    amounts.forEach(amount => {

      total += Number(amount.value || 0);

    });


    document
      .getElementById("totalAmount")
      .innerText =
        total.toFixed(2);

  }


  /* =========================================
     SAVE ORDER
     ========================================= */

  async function saveOrder() {

    const partyName =
      document
        .getElementById("partyName")
        .value
        .trim();


    const orderDate =
      document
        .getElementById("orderDate")
        .value;


    if (!partyName) {

      alert("Please enter Party Name");

      return;

    }


    const rows =
      document.querySelectorAll(".item-row");


    const items = [];


    rows.forEach(row => {

      const product =
        row
          .querySelector(".product")
          .value
          .trim();


      const quantityValue =
        row
          .querySelector(".quantity")
          .value;


      const amountValue =
        row
          .querySelector(".amount")
          .value;


      if (product) {

        items.push({

          product_details: product,

          quantity:
            quantityValue
              ? Number(quantityValue)
              : null,

          amount:
            amountValue
              ? Number(amountValue)
              : null,

          status: "New Enquiry"

        });

      }

    });


    if (items.length === 0) {

      alert("Please add at least one product");

      return;

    }


    /* SAVE MAIN ORDER */

    const {
      data: order,
      error: orderError
    } = await supabaseClient

      .from("orders")

      .insert({
        party_name: partyName,
        order_date: orderDate
      })

      .select()

      .single();


    if (orderError) {

      console.error(orderError);

      alert(
        "Error saving order: " +
        orderError.message
      );

      return;

    }


    /* ADD ORDER ID TO EACH ITEM */

    const itemsToSave =
      items.map(item => ({

        order_id: order.id,

        product_details:
          item.product_details,

        quantity:
          item.quantity,

        amount:
          item.amount,

        status:
          item.status

      }));


    /* SAVE ORDER ITEMS */

    const {
      error: itemsError
    } = await supabaseClient

      .from("order_items")

      .insert(itemsToSave);


    if (itemsError) {

      console.error(itemsError);

      alert(
        "Order saved, but product details failed: " +
        itemsError.message
      );

      return;

    }


    alert("Order Saved Successfully!");


    clearForm();

    loadOrders();

  }


  /* =========================================
     LOAD ORDERS
     ONE PARTY + ONE DATE = ONE ROW
     ========================================= */

  async function loadOrders() {

    const {
      data,
      error
    } = await supabaseClient

      .from("orders")

      .select(`
        id,
        order_date,
        party_name,
        order_items (
          id,
          product_details,
          quantity,
          amount
        )
      `)

      .order(
        "id",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(error);

      return;

    }


    const list =
      document.getElementById("ordersList");


    list.innerHTML = "";


    data.forEach(order => {

      let products = "";
      let quantities = "";
      let amounts = "";


      if (
        order.order_items &&
        order.order_items.length > 0
      ) {

        order.order_items.forEach(item => {

          products += `
            <div>
              ${item.product_details || "-"}
            </div>
          `;


          quantities += `
            <div>
              ${item.quantity ?? "-"}
            </div>
          `;


          amounts += `
            <div>
              ${
                item.amount !== null &&
                item.amount !== undefined
                  ? "₹ " +
                    Number(item.amount).toFixed(2)
                  : "-"
              }
            </div>
          `;

        });

      } else {

        products = "<div>-</div>";

        quantities = "<div>-</div>";

        amounts = "<div>-</div>";

      }


      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td>
          ${order.order_date || "-"}
        </td>

        <td>
          ${order.party_name || "-"}
        </td>

        <td class="multi-line">
          ${products}
        </td>

        <td class="multi-line">
          ${quantities}
        </td>

        <td class="multi-line">
          ${amounts}
        </td>

      `;


      list.appendChild(row);

    });

  }


  /* =========================================
     CLEAR FORM
     ========================================= */

  function clearForm() {

    document
      .getElementById("partyName")
      .value = "";


    document
      .getElementById("orderDate")
      .valueAsDate =
        new Date();


    document
      .getElementById("itemsContainer")
      .innerHTML = "";


    addItem();


    calculateTotal();

  }


  /* =========================================
     SCROLL TO ORDER FORM
     ========================================= */

  function showOrderForm() {

    document
      .getElementById("orderForm")
      .scrollIntoView({
        behavior: "smooth"
      });

  }

</script>

</body>
</html>
