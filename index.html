<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SKV Press Orders</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      font-size: 22px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      padding: 10px;
    }

    .edit-btn {
      background: #10b981;
      color: white;
      padding: 8px 14px;
    }

    .row-actions {
      display: flex;
      gap: 8px;
      white-space: nowrap;
    }

    .row-actions button {
      padding: 6px 10px;
      font-size: 13px;
    }

    .order-card-actions {
      display: flex;
      gap: 8px;
    }

    .order-card-actions button {
      padding: 6px 12px;
      font-size: 13px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
    }

    .items-header,
    .item-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 50px;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .items-header {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .total {
      text-align: right;
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .orders-cards {
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th,
    td {
      padding: 12px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #f9fafb;
      white-space: nowrap;
    }

    .multi-line div {
      padding: 4px 0;
      min-height: 28px;
      border-bottom: 1px solid #f1f1f1;
    }

    .multi-line div:last-child {
      border-bottom: none;
    }

    @media (max-width: 700px) {

      header {
        padding: 14px;
      }

      header h1 {
        font-size: 18px;
      }

      header button {
        padding: 9px 12px;
      }

      .container {
        padding: 12px;
      }

      .card {
        padding: 15px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .items-header {
        display: none;
      }

      .item-row {
        grid-template-columns: 1fr 1fr;
        background: #f9fafb;
        padding: 12px;
        border-radius: 8px;
      }

      .item-row input:first-child {
        grid-column: span 2;
      }

      .delete-btn {
        grid-column: span 2;
        width: 100%;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        min-width: 750px;
      }

      th,
      td {
        padding: 10px;
        font-size: 14px;
      }
    }
    /* =========================
   MOBILE RESPONSIVE
========================= */

@media (max-width: 600px) {

    body {
        padding: 0;
    }

    header {
        padding: 14px 12px;
    }

    header h1 {
        font-size: 20px;
    }

    .container {
        width: 100%;
        padding: 12px;
    }

    .card {
        padding: 14px;
        border-radius: 12px;
    }

    /* Party + Date */
    .top-row {
        grid-template-columns: 1fr !important;
        gap: 12px;
    }

    /* Product Row */
.item-row {
    display: grid !important;
    grid-template-columns: 1fr 1fr auto !important;
    gap: 8px;
}

.item-row input:first-child {
    grid-column: 1 / -1;
}

/* Remove button */

.delete-btn {
    grid-column: auto !important;
    width: 44px !important;
    min-width: 44px;
    height: 44px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}

    /* Buttons */
    .actions {
        flex-direction: column;
        gap: 8px;
    }

    .actions button {
        width: 100%;
    }

    /* Orders Table */
.orders-table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;
    min-width: 700px;
}

/* Orders: table on desktop, cards on mobile */
.table-wrapper {
    display: none;
}

.orders-cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.order-card {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px;
}

.order-card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #e5e7eb;
}

.order-card-date {
    font-size: 13px;
    color: #6b7280;
    font-weight: bold;
}

.order-card-party {
    font-size: 16px;
    font-weight: bold;
    color: #111;
}

.order-card-item {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px dashed #e5e7eb;
    font-size: 14px;
}

.order-card-item:last-child {
    border-bottom: none;
}

.order-card-item .product {
    font-weight: bold;
    color: #111;
}

.order-card-item .qty {
    color: #6b7280;
}

.order-card-item .amount {
    color: #2563eb;
    font-weight: bold;
    text-align: right;
}
}
  </style>
</head>

<body>

<header>
  <h1>SKV Press Orders</h1>

  <button class="primary" onclick="showOrderForm()">
    + New Order
  </button>
</header>


<div class="container">

  <!-- NEW ORDER FORM -->

  <div id="orderForm" class="card">

    <div class="top-bar">
      <h2 id="formTitle">New Order</h2>
    </div>


    <div class="form-grid">

      <div>
        <label>Party Name</label>

        <input
          type="text"
          id="partyName"
          placeholder="Enter party name"
        />
      </div>


      <div>
        <label>Order Date</label>

        <input
          type="date"
          id="orderDate"
        />
      </div>

    </div>


    <br>


    <h3>Order Items</h3>


    <div class="items-header">
      <div>Product Details</div>
      <div>Quantity</div>
      <div>Amount</div>
      <div></div>
    </div>


    <div id="itemsContainer"></div>


    <br>


    <button
      type="button"
      class="secondary"
      onclick="addItem()"
    >
      + Add Item
    </button>


    <div class="total">
      Total: ₹ <span id="totalAmount">0.00</span>
    </div>


    <div class="actions">

      <button
        type="button"
        class="secondary"
        onclick="clearForm()"
      >
        Cancel
      </button>


      <button
        type="button"
        class="primary"
        id="saveOrderBtn"
        onclick="saveOrder()"
      >
        Save Order
      </button>

    </div>

  </div>


  <!-- ORDERS LIST -->

  <div class="card">

    <div class="top-bar">

      <h2>Orders</h2>

      <button
        class="secondary"
        onclick="loadOrders()"
      >
        Refresh
      </button>

    </div>


    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>Date</th>
            <th>Party Name</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Amount</th>
            <th>Actions</th>
          </tr>
        </thead>


        <tbody id="ordersList"></tbody>

      </table>

    </div>

    <div class="orders-cards" id="ordersCards"></div>

  </div>

</div>


<script>

  /* =========================================
     SUPABASE CONFIGURATION
     ========================================= */

  const SUPABASE_URL = "https://vcyhaztkucppqfcvoari.supabase.co";

  const SUPABASE_KEY = "sb_publishable_KuuyyC6f2LL6T2M1F0V8OQ_wSVRNccO";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     EDIT MODE STATE
     ========================================= */

  let editingOrderId = null;

  let ordersData = [];


  /* =========================================
     INITIAL SETUP
     ========================================= */

  document
    .getElementById("orderDate")
    .valueAsDate = new Date();


  addItem();

  loadOrders();


  /* =========================================
     ADD ITEM
     ========================================= */

  function addItem(product, quantity, amount) {

    const container =
      document.getElementById("itemsContainer");


    const row =
      document.createElement("div");


    row.className = "item-row";


    row.innerHTML = `

      <input
        type="text"
        class="product"
        placeholder="Product details"
        value="${product ? String(product).replace(/"/g, "&quot;") : ""}"
      />

      <input
        type="number"
        class="quantity"
        placeholder="Qty"
        min="1"
        value="${quantity !== undefined && quantity !== null ? quantity : ""}"
      />

      <input
        type="number"
        class="amount"
        placeholder="Amount"
        min="0"
        step="0.01"
        oninput="calculateTotal()"
        value="${amount !== undefined && amount !== null ? amount : ""}"
      />

      <button
        type="button"
        class="delete-btn"
        onclick="removeItem(this)"
      >
        ✕
      </button>

    `;


    container.appendChild(row);


    calculateTotal();

  }


  /* =========================================
     REMOVE ITEM
     ========================================= */

  function removeItem(button) {

    const row = button.parentElement;

    row.remove();

    calculateTotal();

  }


  /* =========================================
     CALCULATE TOTAL
     ========================================= */

  function calculateTotal() {

    let total = 0;


    const amounts =
      document.querySelectorAll(".amount");


    amounts.forEach(amount => {

      total += Number(amount.value || 0);

    });


    document
      .getElementById("totalAmount")
      .innerText =
        total.toFixed(2);

  }


  /* =========================================
     SAVE ORDER
     ========================================= */

  async function saveOrder() {

    const partyName =
      document
        .getElementById("partyName")
        .value
        .trim();


    const orderDate =
      document
        .getElementById("orderDate")
        .value;


    if (!partyName) {

      alert("Please enter Party Name");

      return;

    }


    const rows =
      document.querySelectorAll(".item-row");


    const items = [];


    rows.forEach(row => {

      const product =
        row
          .querySelector(".product")
          .value
          .trim();


      const quantityValue =
        row
          .querySelector(".quantity")
          .value;


      const amountValue =
        row
          .querySelector(".amount")
          .value;


      if (product) {

        items.push({

          product_details: product,

          quantity:
            quantityValue
              ? Number(quantityValue)
              : null,

          amount:
            amountValue
              ? Number(amountValue)
              : null,

          status: "New Enquiry"

        });

      }

    });


    if (items.length === 0) {

      alert("Please add at least one product");

      return;

    }


    const isEditing = editingOrderId !== null;


    let orderId;


    if (isEditing) {

      /* UPDATE MAIN ORDER */

      const {
        error: updateError
      } = await supabaseClient

        .from("orders")

        .update({
          party_name: partyName,
          order_date: orderDate
        })

        .eq("id", editingOrderId);


      if (updateError) {

        console.error(updateError);

        alert(
          "Error updating order: " +
          updateError.message
        );

        return;

      }


      orderId = editingOrderId;


      /* REMOVE OLD ITEMS BEFORE RE-ADDING */

      const {
        error: deleteItemsError
      } = await supabaseClient

        .from("order_items")

        .delete()

        .eq("order_id", orderId);


      if (deleteItemsError) {

        console.error(deleteItemsError);

        alert(
          "Error updating product details: " +
          deleteItemsError.message
        );

        return;

      }

    } else {

      /* SAVE MAIN ORDER */

      const {
        data: order,
        error: orderError
      } = await supabaseClient

        .from("orders")

        .insert({
          party_name: partyName,
          order_date: orderDate
        })

        .select()

        .single();


      if (orderError) {

        console.error(orderError);

        alert(
          "Error saving order: " +
          orderError.message
        );

        return;

      }


      orderId = order.id;

    }


    /* ADD ORDER ID TO EACH ITEM */

    const itemsToSave =
      items.map(item => ({

        order_id: orderId,

        product_details:
          item.product_details,

        quantity:
          item.quantity,

        amount:
          item.amount,

        status:
          item.status

      }));


    /* SAVE ORDER ITEMS */

    const {
      error: itemsError
    } = await supabaseClient

      .from("order_items")

      .insert(itemsToSave);


    if (itemsError) {

      console.error(itemsError);

      alert(
        (isEditing ? "Order updated, but" : "Order saved, but") +
        " product details failed: " +
        itemsError.message
      );

      return;

    }


    alert(
      isEditing
        ? "Order Updated Successfully!"
        : "Order Saved Successfully!"
    );


    clearForm();

    loadOrders();

  }


  /* =========================================
     LOAD ORDERS
     ONE PARTY + ONE DATE = ONE ROW
     ========================================= */

  async function loadOrders() {

    const {
      data,
      error
    } = await supabaseClient

      .from("orders")

      .select(`
        id,
        order_date,
        party_name,
        order_items (
          id,
          product_details,
          quantity,
          amount
        )
      `)

      .order(
        "id",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(error);

      return;

    }


    ordersData = data;


    const list =
      document.getElementById("ordersList");

    const cardsContainer =
      document.getElementById("ordersCards");


    list.innerHTML = "";

    cardsContainer.innerHTML = "";


    data.forEach(order => {

      let products = "";
      let quantities = "";
      let amounts = "";

      let cardItems = "";


      if (
        order.order_items &&
        order.order_items.length > 0
      ) {

        order.order_items.forEach(item => {

          products += `
            <div>
              ${item.product_details || "-"}
            </div>
          `;


          quantities += `
            <div>
              ${item.quantity ?? "-"}
            </div>
          `;


          amounts += `
            <div>
              ${
                item.amount !== null &&
                item.amount !== undefined
                  ? "₹ " +
                    Number(item.amount).toFixed(2)
                  : "-"
              }
            </div>
          `;


          cardItems += `
            <div class="order-card-item">
              <div class="product">${item.product_details || "-"}</div>
              <div class="qty">${item.quantity !== null && item.quantity !== undefined ? "Qty: " + item.quantity : ""}</div>
              <div class="amount">${
                item.amount !== null &&
                item.amount !== undefined
                  ? "₹ " + Number(item.amount).toFixed(2)
                  : "-"
              }</div>
            </div>
          `;

        });

      } else {

        products = "<div>-</div>";

        quantities = "<div>-</div>";

        amounts = "<div>-</div>";

        cardItems = `
          <div class="order-card-item">
            <div class="product">-</div>
            <div class="qty"></div>
            <div class="amount">-</div>
          </div>
        `;

      }


      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td>
          ${order.order_date || "-"}
        </td>

        <td>
          ${order.party_name || "-"}
        </td>

        <td class="multi-line">
          ${products}
        </td>

        <td class="multi-line">
          ${quantities}
        </td>

        <td class="multi-line">
          ${amounts}
        </td>

        <td>
          <div class="row-actions">
            <button
              type="button"
              class="edit-btn"
              onclick="editOrder(${order.id})"
            >
              Edit
            </button>
            <button
              type="button"
              class="delete-btn"
              onclick="deleteOrder(${order.id})"
            >
              Delete
            </button>
          </div>
        </td>

      `;


      list.appendChild(row);


      const card =
        document.createElement("div");


      card.className = "order-card";


      card.innerHTML = `

        <div class="order-card-header">
          <div>
            <div class="order-card-party">${order.party_name || "-"}</div>
            <div class="order-card-date">${order.order_date || "-"}</div>
          </div>
          <div class="order-card-actions">
            <button
              type="button"
              class="edit-btn"
              onclick="editOrder(${order.id})"
            >
              Edit
            </button>
            <button
              type="button"
              class="delete-btn"
              onclick="deleteOrder(${order.id})"
            >
              Delete
            </button>
          </div>
        </div>

        ${cardItems}

      `;


      cardsContainer.appendChild(card);

    });

  }


  /* =========================================
     EDIT ORDER
     ========================================= */

  function editOrder(orderId) {

    const order =
      ordersData.find(o => o.id === orderId);


    if (!order) {

      alert("Order not found. Please refresh and try again.");

      return;

    }


    editingOrderId = orderId;


    document
      .getElementById("partyName")
      .value = order.party_name || "";


    document
      .getElementById("orderDate")
      .value = order.order_date || "";


    const itemsContainer =
      document.getElementById("itemsContainer");


    itemsContainer.innerHTML = "";


    if (order.order_items && order.order_items.length > 0) {

      order.order_items.forEach(item => {

        addItem(
          item.product_details,
          item.quantity,
          item.amount
        );

      });

    } else {

      addItem();

    }


    calculateTotal();


    document
      .getElementById("formTitle")
      .innerText = "Edit Order";


    document
      .getElementById("saveOrderBtn")
      .innerText = "Update Order";


    showOrderForm();

  }


  /* =========================================
     DELETE ORDER
     ========================================= */

  async function deleteOrder(orderId) {

    const confirmDelete =
      confirm(
        "Are you sure you want to delete this order and all its products? This cannot be undone."
      );


    if (!confirmDelete) {

      return;

    }


    const {
      error: itemsError
    } = await supabaseClient

      .from("order_items")

      .delete()

      .eq("order_id", orderId);


    if (itemsError) {

      console.error(itemsError);

      alert(
        "Error deleting order items: " +
        itemsError.message
      );

      return;

    }


    const {
      error: orderError
    } = await supabaseClient

      .from("orders")

      .delete()

      .eq("id", orderId);


    if (orderError) {

      console.error(orderError);

      alert(
        "Error deleting order: " +
        orderError.message
      );

      return;

    }


    /* IF THE DELETED ORDER WAS BEING EDITED, RESET THE FORM */

    if (editingOrderId === orderId) {

      clearForm();

    }


    alert("Order Deleted Successfully!");


    loadOrders();

  }


  /* =========================================
     CLEAR FORM
     ========================================= */

  function clearForm() {

    editingOrderId = null;


    document
      .getElementById("formTitle")
      .innerText = "New Order";


    document
      .getElementById("saveOrderBtn")
      .innerText = "Save Order";


    document
      .getElementById("partyName")
      .value = "";


    document
      .getElementById("orderDate")
      .valueAsDate =
        new Date();


    document
      .getElementById("itemsContainer")
      .innerHTML = "";


    addItem();


    calculateTotal();

  }


  /* =========================================
     SCROLL TO ORDER FORM
     ========================================= */

  function showOrderForm() {

    document
      .getElementById("orderForm")
      .scrollIntoView({
        behavior: "smooth"
      });

  }

</script>

</body>
</html>
